[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentforge-sdk"
version = "1.0.0"
description = "SDK Python pour la marketplace AgentForge."
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Koami Mawuli Crépin AZIAMADJI"}]
dependencies = ["httpx>=0.27"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.10"]

[tool.setuptools.packages.find]
include = ["agentforge*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
python_version = "3.10"
strict = false